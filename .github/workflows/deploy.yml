name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Purge public digital page cache
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/zones?name=wooplans.com' \
            | jq -r '.result[0].id')"
          test -n "$zone_id" && test "$zone_id" != "null"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"files":["https://cpbook.wooplans.com/digital","https://cpbook.wooplans.com/digital/","https://cpbook.wooplans.com/index-digital.html"]}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache"

      - name: Verify public digital page
        shell: bash
        run: |
          url="https://cpbook.wooplans.com/digital?deployment=${GITHUB_SHA}"
          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            --dump-header /tmp/cpbook-headers.txt \
            --output /tmp/cpbook-digital.html \
            "$url"
          cat /tmp/cpbook-headers.txt
          grep -F 'id="bonusSpecial"' /tmp/cpbook-digital.html
          grep -F '+450 avis' /tmp/cpbook-digital.html
