<style>
:root {
  --teal:      #0F5B59;
  --teal-dark: #0A3F3E;
  --orange:    #F08A2E;
  --orange-dk: #D4731A;
  --red:       #C75B3A;
  --gold:      #E7C36C;
  --dark:      #1E2933;
  --gray:      #6B7280;
  --bg:        #F5F7F9;
  --white:     #FFFFFF;
  --border:    rgba(15,91,89,0.12);
  --shadow:    0 4px 24px rgba(15,91,89,0.10);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--dark);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* â”€â”€ TOPBAR (hidden in hero, shown after) â”€â”€ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:300;
  background:#8f2f1e;
  padding:12px 20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
  transform:translateY(-100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.topbar.visible{transform:translateY(0)}
.topbar-logo{display:flex;align-items:center;line-height:0}
.topbar-logo img{display:block;width:auto;height:34px;max-width:196px}
.topbar-btn{background:var(--orange);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;padding:10px 18px;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background 0.2s,transform 0.15s;white-space:nowrap}
.topbar-btn:active{transform:scale(0.97);background:var(--orange-dk)}
.topbar-fomo{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;text-align:center}
.topbar-fomo strong{font-size:18px;letter-spacing:.04em;color:#FFD39B}

/* â”€â”€ HERO â”€â”€ */
.hero{
  min-height:100svh;
  background:var(--teal);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:48px 24px 40px;
  position:relative;overflow:hidden;
  text-align:center;
}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 80% 20%, rgba(231,195,108,0.08) 0%, transparent 60%),radial-gradient(ellipse 40% 40% at 10% 80%, rgba(231,195,108,0.05) 0%, transparent 60%);pointer-events:none}

.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;background:rgba(231,195,108,0.12);border:1px solid rgba(231,195,108,0.35);padding:5px 12px;border-radius:4px;margin-bottom:20px}
.hero-eyebrow span{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold)}

.hero h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(30px,8.5vw,52px);color:var(--white);line-height:1.08;letter-spacing:-0.025em;margin-bottom:14px}
.hero h1 .hl{color:var(--gold)}

/* RATING */
.hero-rating{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.rating-stars{color:var(--gold);font-size:18px;letter-spacing:1px;line-height:1}
.rating-text{font-size:13px;color:rgba(255,255,255,0.75);font-weight:500}
.rating-text strong{color:var(--white);font-weight:700}

.hero-sub{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.65;margin-bottom:28px;max-width:460px;font-weight:400}

/* VSL */
.vsl-wrap{border-radius:12px;overflow:hidden;background:var(--teal-dark);aspect-ratio:16/9;position:relative;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,0.35);cursor:pointer;width:100%;max-width:520px}
.vsl-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--teal-dark) 0%,#082828 100%);gap:14px}
.vsl-play{width:68px;height:68px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(240,138,46,0.18);transition:transform 0.2s,box-shadow 0.2s}
.vsl-wrap:hover .vsl-play{transform:scale(1.08);box-shadow:0 0 0 20px rgba(240,138,46,0.12)}
.vsl-play::after{content:'';border-left:24px solid white;border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:5px}
.vsl-lbl{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:13px;color:rgba(255,255,255,0.55);letter-spacing:0.04em}
.vsl-dur{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.55);color:white;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}

/* PRICE */
.hero-price{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:20px}
.price-row{display:flex;align-items:center;gap:10px}
.price-old{font-size:16px;color:rgba(255,255,255,0.4);text-decoration:line-through;font-weight:500}
.price-badge{background:var(--red);color:white;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:12px;padding:4px 10px;border-radius:4px;white-space:nowrap}
.price-new{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:44px;color:var(--white);letter-spacing:-0.025em;line-height:1}
.price-fcfa{font-size:16px;font-weight:600;color:rgba(255,255,255,0.65);margin-left:2px}

/* CTA */
.hero-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:400px;background:var(--orange);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:16px;padding:18px 24px;border:none;border-radius:8px;cursor:pointer;transition:background 0.2s,transform 0.15s,box-shadow 0.2s;box-shadow:0 4px 20px rgba(240,138,46,0.35);margin-bottom:20px}
.hero-cta:active{transform:scale(0.98);background:var(--orange-dk)}
.wa-svg{width:22px;height:22px;fill:white;flex-shrink:0}

/* SOCIAL BADGE */
.social-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:99px;padding:8px 14px}
.avatar-stack{display:flex}
.avatar-mini{width:28px;height:28px;border-radius:50%;border:2px solid var(--teal);background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;margin-left:-8px;overflow:hidden}
.avatar-mini:first-child{margin-left:0}
.social-text{font-size:13px;color:rgba(255,255,255,0.85);font-weight:500}
.social-text strong{color:var(--white);font-weight:700}

/* â”€â”€ PROOF BAR â”€â”€ */
.proof-bar{background:var(--white);padding:14px 20px;display:flex;align-items:center;gap:16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.proof-bar::-webkit-scrollbar{display:none}
.proof-item{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.proof-num{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;color:var(--teal);line-height:1}
.proof-text{font-size:12px;color:var(--gray);line-height:1.3}
.proof-sep{width:1px;height:30px;background:var(--border);flex-shrink:0}

/* â”€â”€ URGENCY / OFFRE LIMITÃ‰E â”€â”€ */
.offre-banner{background:var(--red);padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.offre-banner span{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:13px;color:white;text-align:center}

/* â”€â”€ JAUGE OFFRE â”€â”€ */
.gauge-section{background:var(--white);padding:14px 20px;border-bottom:1px solid var(--border)}
.gauge-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gauge-label{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;color:var(--dark)}
.gauge-count{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:13px;color:var(--red)}
.gauge-bg{height:10px;background:#E5E7EB;border-radius:99px;overflow:hidden}
.gauge-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--red));border-radius:99px;transition:width 1.2s cubic-bezier(0.4,0,0.2,1)}
.gauge-sub{margin-top:6px;font-size:12px;color:var(--gray);display:flex;align-items:center;gap:5px}
.gauge-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:blink 1.2s ease-in-out infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* VALUE STACK / COUNTDOWN / GUARANTEE */
.value-stack{background:var(--white);border:1px solid rgba(15,91,89,.14);border-radius:18px;padding:24px;box-shadow:0 14px 40px rgba(15,91,89,.12);margin-top:26px}
.value-stack h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;line-height:1.15;color:var(--dark);margin-bottom:8px}
.value-stack-intro{font-size:14px;line-height:1.65;color:var(--gray);margin-bottom:18px}
.value-table{width:100%;border-collapse:collapse;font-size:13px}
.value-table td{padding:11px 0;border-bottom:1px solid var(--border);vertical-align:top}
.value-table td:last-child{text-align:right;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;color:var(--teal);white-space:nowrap}
.value-table tr.total td{font-weight:800;color:var(--dark);border-bottom:0;padding-top:16px}
.value-table tr.total td:last-child{font-size:18px;color:var(--teal)}
.value-table tr.price td{border-top:2px solid var(--orange);border-bottom:0;padding-top:14px;font-weight:800}
.value-table tr.price td:last-child{font-size:22px;color:var(--orange)}
.value-foot{font-size:13px;line-height:1.6;color:var(--gray);margin-top:16px}
.countdown{display:flex;align-items:center;justify-content:center;gap:9px;background:#8f2f1e;border:2px solid #ffbd78;border-radius:12px;padding:12px 16px;margin:0 auto 18px;max-width:420px;color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;box-shadow:0 8px 22px rgba(143,47,30,.32)}
.countdown strong{font-size:22px;letter-spacing:.04em;color:var(--white);text-shadow:0 1px 1px rgba(0,0,0,.18)}
.countdown-final{background:rgba(255,255,255,.08);border:1px dashed rgba(255,211,155,.9);color:#FFD39B;box-shadow:none;max-width:360px;font-size:12px}
.countdown-final strong{color:#FFD39B;text-shadow:none}
@keyframes fomoPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.58;transform:scale(1.045)}}
.topbar-fomo strong,.countdown-final strong{animation:fomoPulse 1.15s ease-in-out infinite}
.hero-value-anchor{font-size:13px;color:rgba(255,255,255,.72);margin:-8px 0 18px}
.guarantee-box{display:flex;align-items:flex-start;gap:12px;background:#FFF8ED;border:1px solid rgba(240,138,46,.35);border-radius:12px;padding:15px 16px;margin-top:18px;color:var(--dark)}
.guarantee-box strong{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;margin-bottom:4px}
.guarantee-box p{font-size:12px;line-height:1.55;color:var(--gray)}
.guarantee-mark{font-size:22px;line-height:1}
.written-testimonials{margin-top:24px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.written-testimonials::-webkit-scrollbar{display:none}
.written-testimonial{min-width:min(82vw,330px);scroll-snap-align:start;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.written-person{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.written-person img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--white)}
.written-person strong{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--dark)}
.written-person span{display:block;font-size:12px;color:var(--gray);margin-top:2px}
.verified-badge{display:inline-flex;align-items:center;gap:4px;margin:0 0 10px;font-size:10px;font-weight:800;color:var(--teal);letter-spacing:.02em}
.written-testimonial blockquote{font-size:14px;line-height:1.65;color:var(--dark);font-style:italic}
.written-testimonial small{display:block;margin-top:10px;font-size:10px;line-height:1.4;color:var(--red)}
.written-dots{text-align:center;font-size:18px;letter-spacing:4px;color:var(--orange);margin-top:2px}
.section-rating{display:flex;align-items:center;gap:9px;margin:14px 0 22px;font-size:13px;color:var(--gray);font-weight:700}
.section-rating-stars{color:var(--gold);font-size:19px;letter-spacing:1px;line-height:1}
.section-rating strong{color:var(--dark);font-family:'Plus Jakarta Sans',sans-serif;font-weight:800}
.testi-rating{margin-top:4px;color:var(--gold);font-size:12px;letter-spacing:1px;line-height:1}
.sticky-countdown{font-size:11px;color:var(--red);font-weight:700;margin-top:2px}
.support-guarantee{max-width:680px;margin:24px auto 0;background:var(--white);border-radius:18px;padding:26px 24px;color:var(--dark);box-shadow:0 14px 36px rgba(0,0,0,.12)}
.support-guarantee h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;line-height:1.2;margin-bottom:10px}
.support-guarantee p{font-size:14px;line-height:1.65;color:var(--gray);margin-bottom:18px}
.guarantee-points{display:grid;gap:9px;margin:0 0 20px;padding:0;list-style:none}
.guarantee-points li{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5;color:var(--dark);font-weight:700}
.guarantee-points li::before{content:'âœ“';display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:rgba(15,91,89,.1);color:var(--teal);font-size:12px;font-weight:800}
.support-links{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.support-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:13px;text-decoration:none}
.support-link.email{background:rgba(15,91,89,.1);color:var(--teal);border:1px solid rgba(15,91,89,.18)}
.support-link.whatsapp{background:#25D366;color:#fff}
.guarantee-compact{display:flex;align-items:center;justify-content:center;gap:7px;margin:14px auto 0;color:var(--gray);font-size:12px;font-weight:700}
.guarantee-compact .guarantee-mark{font-size:16px;color:var(--teal)}
.hero-guarantee-compact{color:rgba(255,255,255,.62);margin-top:14px}
.hero-guarantee-compact .guarantee-mark{color:rgba(255,255,255,.7)}
@keyframes stickyShake{0%,88%,100%{transform:translateX(0)}90%{transform:translateX(-2px)}92%{transform:translateX(2px)}94%{transform:translateX(-2px)}96%{transform:translateX(0)}}
.sticky-btn{animation:stickyShake 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.sticky-btn{animation:none}}
@media(max-width:560px){.value-stack{padding:18px}.value-table{font-size:12px}.value-table td{padding:9px 0}.countdown{font-size:12px}.countdown strong{font-size:18px}}

/* â”€â”€ SECTIONS â”€â”€ */
section{padding:56px 20px}
.s-white{background:var(--white)}
.s-teal{background:var(--teal);color:var(--white)}
.s-bg{background:var(--bg)}
.s-dark{background:var(--dark);color:var(--white)}

.section-label{display:inline-block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.section-label-gold{color:var(--gold)}

h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(24px,6vw,36px);line-height:1.1;letter-spacing:-0.02em;margin-bottom:8px}
.ao{color:var(--orange)}
.ag{color:var(--gold)}
.aw{color:var(--white)}

.section-intro{font-size:14px;line-height:1.75;color:var(--gray);margin-bottom:28px}
.section-intro-light{color:rgba(255,255,255,0.65)}

/* â”€â”€ INSIDE LIST â”€â”€ */
.inside-list{display:grid;grid-template-columns:1fr;gap:16px}
.inside-item{display:flex;align-items:flex-start;gap:14px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.inside-icon{width:44px;height:44px;background:rgba(15,91,89,0.08);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.inside-text h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:var(--dark);margin-bottom:3px}
.inside-text p{font-size:13px;color:var(--gray);line-height:1.55}

/* â”€â”€ FIT / RISK SECTIONS â”€â”€ */
.info-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:24px}
.info-card{
  display:flex;
  align-items:flex-start;
  gap:14px;
  background:var(--white);
  border:1px solid rgba(15,91,89,0.08);
  border-radius:14px;
  padding:18px 20px;
  box-shadow:0 10px 30px rgba(15,91,89,0.08);
}
.info-card.check{padding:20px 22px}
.info-mark{
  width:40px;
  height:40px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:20px;
}
.info-card.check .info-mark{
  width:auto;
  height:auto;
  border-radius:0;
  background:none;
  color:var(--teal);
  font-size:18px;
  padding-top:2px;
}
.info-card.risk .info-mark{
  background:rgba(240,138,46,0.10);
}
.info-copy{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-weight:700;
  font-size:17px;
  line-height:1.45;
  color:var(--dark);
}

/* â”€â”€ CATALOG PREVIEW â”€â”€ */
.catalog-preview-wrap{margin-top:24px}
.catalog-video-card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.12);
}
.catalog-video-frame{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background:linear-gradient(135deg,#0A3F3E 0%, #0F5B59 100%);

}

  width:100%;
  height:100%;

}

}

/* â”€â”€ TÃ‰MOIGNAGES 2x2 9:16 â”€â”€ */
.testi-grid-2x2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.testi-card{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
.testi-card:active{transform:scale(0.99)}
.testi-video{aspect-ratio:9/16;background:var(--dark);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.testi-video-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--teal-dark) 0%,#071A1A 100%)}
.testi-play{position:relative;z-index:1;width:44px;height:44px;background:rgba(240,138,46,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
.testi-card:hover .testi-play{transform:scale(1.08)}
.testi-play::after{content:'';border-left:15px solid white;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}

/* â”€â”€ VIDEO THUMBNAILS â€” play/pause trick (no canvas, no CORS needed) â”€â”€ */
(function(){
  function autoPlayHeroVideo(){
    var vid=document.getElementById('heroVid');
    var ov=document.getElementById('vslOverlay');
    if(!vid) return;
    vid.muted=false;
    vid.controls=true;
    vid.style.opacity='1';
    if(ov) ov.style.display='none';
    var start=vid.play();
    if(start && typeof start.catch==='function'){
      start.catch(function(){
        if(ov){
          ov.style.display='flex';
          ov.style.background='linear-gradient(135deg,rgba(8,40,40,0.42) 0%,rgba(7,26,26,0.42) 100%)';
        }
      });
    }
  }

  function showThumb(vid,onReady){
    if(!vid) return;
    var done=false;
    function show(){
      if(done) return; done=true;
      vid.style.opacity='1';
      if(onReady) onReady();
    }
    if(vid.readyState>=2){show();return;}
    vid.muted=true;
    var p=vid.play();
    if(p) p.then(function(){vid.pause();vid.currentTime=0;show();}).catch(function(){});
    vid.addEventListener('canplay',show,{once:true});
  }

  autoPlayHeroVideo();

  var io=('IntersectionObserver' in window)&&new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      showThumb(e.target,null);
      io.unobserve(e.target);
    });
  },{rootMargin:'300px'});

  [0,1,2,3].forEach(function(i){
    var v=document.getElementById('tvid'+i);
    if(!v) return;
    if(io) io.observe(v); else showThumb(v,null);
  });
})();
